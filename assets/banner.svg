<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic SVG Animated Elements (Subtle in Background) -->
  <g opacity="0.25">
    <!-- Animated Expanding Radar Waves -->
    <circle cx="950" cy="150" r="40" fill="none" stroke="#818cf8" stroke-width="2">
      <animate attributeName="r" values="40;180;40" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="150" r="90" fill="none" stroke="#c084fc" stroke-width="2">
      <animate attributeName="r" values="90;220;90" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Pulsing Signal Nodes -->
    <circle cx="800" cy="80" r="6" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="220" r="8" fill="#f43f5e" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="240" r="5" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Dynamic Digital Soundwave / Signal Lines -->
    <path d="M 750 150 Q 800 90, 850 150 T 950 150 T 1050 150 T 1150 150" fill="none" stroke="url(#accent-grad)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="
        M 750 150 Q 800 90, 850 150 T 950 150 T 1050 150 T 1150 150;
        M 750 150 Q 800 210, 850 150 T 950 150 T 1050 150 T 1150 150;
        M 750 150 Q 800 90, 850 150 T 950 150 T 1050 150 T 1150 150" 
        dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Content: Title & Subtitle (Always crisp & visible) -->
  <g transform="translate(70, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="230" height="28" rx="14" fill="#6366f1" opacity="0.3"/>
    <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">MEDIA INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Media Monitoring
    </text>

    <!-- Decorative Accent Line -->
    <rect x="0" y="155" width="480" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Curated Ecosystem of SaaS Platforms &amp; Open-Source Tools
    </text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">
      News Tracking • Social Listening • Brand Mentions • Broadcast &amp; Sentiment AI
    </text>
  </g>
</svg>
